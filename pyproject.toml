[project]
name = "wanderlint"
version = "0.1.0"
description = "LLM-powered quality checks for tours & activities listings, with its own eval."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
wanderlint = "wanderlint.pipeline:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Only the labeling tool needs Streamlit; kept separate because it is heavy.
label = [
    "streamlit>=1.38",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanderlint"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
