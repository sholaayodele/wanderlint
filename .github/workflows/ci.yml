# Lint + tests. No API calls and no secrets: tests use fakes, never the API.
# Paused: manual trigger only until the GitHub billing lock is resolved.
# To re-enable, restore `push:` and `pull_request:` under `on:`.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test
