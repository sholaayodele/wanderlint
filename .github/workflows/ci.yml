# Lint + tests on every push. No API calls and no secrets: tests use fakes, never the API.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test
