# Wanderlint defect taxonomy — source of truth (CLAUDE.md §3).
# Changing any definition or decision rule is a taxonomy change:
# bump `version`, log it in failure_patterns.md, re-check affected gold labels.
#
# Scoring unit is (listing_id, defect_id). Each example shows the relevant
# field(s); `note` explains why it is (positive) or is not (negative) this defect.

version: 1

defects:
  - id: D1
    name: Missing required field
    severity: critical
    detection: rule
    definition: >
      A required field is absent, null, empty, whitespace-only, or consists
      only of a known placeholder value (placeholder_values), or a text field
      contains a placeholder substring anywhere (placeholder_substrings).
    required_fields:
      - title
      - short_description
      - description
      - duration
      - meeting_point
      - inclusions
      - cancellation_policy
      - category
    placeholder_values:
      - "TBD"
      - "tbc"
      - "N/A"
      - "n. a."
      - "folgt"
      - "siehe oben"
      - "see above"
      - "xxx"
      - "-"
    placeholder_substrings:
      - "lorem ipsum"
    decision_rules:
      - placeholder_values match case-insensitively on the whole trimmed field value, ignoring trailing punctuation ("TBD!!!" and "XXX" are placeholders); such a value inside longer real text is not D1.
      - A field whose entire value is a placeholder is D1 only, never also D8, even if it has repeated punctuation or caps.
      - placeholder_substrings match case-insensitively anywhere in any text field (including list items); one occurrence makes that field D1 even if it also has real text.
      - An empty list counts as missing for list fields (inclusions).
      - exclusions and tags are optional; empty values there are never D1.
      - A field that is present but wrong or vague (e.g. meeting point "city centre") is not D1; consider D2/D3 instead.
      - One D1 per listing for scoring, even if several fields are missing; list each field as a separate span.
      - A missing or invalid locale is an ingestion error, reported separately and not scored; it is never D1.
    examples:
      positive:
        - locale: en-GB
          field: meeting_point
          text: 'meeting_point: ""'
          note: Empty string counts as missing.
        - locale: de-DE
          field: cancellation_policy
          text: 'cancellation_policy: "folgt"'
          note: Placeholder ("to follow") counts as missing.
      negative:
        - locale: en-GB
          field: exclusions
          text: 'exclusions: []'
          note: exclusions is optional; an empty list is fine.

  - id: D2
    name: Internal inconsistency
    severity: critical
    detection: llm
    definition: >
      Two fields of the same listing state facts that contradict each other
      (duration, times, group size, language, location, age limits, what is
      included). Both sides of the contradiction are in the listing.
    decision_rules:
      - A claim contradicted by another field is D2; a claim with no support anywhere is D3.
      - A promised item that is merely absent from inclusions is D4; if it is listed in exclusions, it is D2.
      - An item listed in inclusions that the description says costs extra is D2.
      - Ranges that overlap (title "2–3 hours", duration 2.5h) are not a contradiction.
      - Quote both conflicting spans as evidence (one span per side).
    examples:
      positive:
        - locale: en-GB
          field: title, duration
          text: 'title: "3-Hour Tapas Walking Tour" / duration: "2 hours"'
          note: Title duration contradicts the duration field.
        - locale: de-DE
          field: description, exclusions
          text: 'description: "Inklusive Mittagessen in einer Trattoria" / exclusions: ["Mittagessen"]'
          note: Lunch is both promised and explicitly excluded.
      negative:
        - locale: de-DE
          field: title, duration
          text: 'title: "Halbtägige Weinprobe" / duration: "4 Stunden"'
          note: Half-day and 4 hours are compatible.

  - id: D3
    name: Unsupported / misleading claim
    severity: critical
    detection: llm
    definition: >
      The listing makes a qualitative or feature claim about the experience
      (skip-the-line, private, small group, wheelchair accessible, guaranteed
      sighting, "official", superlatives such as "the best" / "the only")
      that no structured attribute or other field supports, or that
      overstates what the product delivers.
    decision_rules:
      - Check claims against `attributes` first; a claim backed by a true attribute is not D3.
      - If an attribute or field contradicts the claim, label D2, not D3.
      - Plain subjective marketing ("stunning views", "unforgettable") is not D3.
      - Guarantees of outcomes outside the operator's control (weather, wildlife) are D3 unless qualified.
      - D3 vs D4 — something the customer receives (food, drinks, tickets, transport, pickup, equipment, guide) is D4; a qualitative/feature claim about the experience is D3.
      - Price or promotion language ("best price", "20 % off") is D6, not D3.
    examples:
      positive:
        - locale: en-GB
          field: title
          text: 'title: "Skip-the-Line Colosseum Tour" / attributes: {}'
          note: Skip-the-line claimed with no skip_the_line attribute.
        - locale: de-DE
          field: description
          text: 'description: "Wale garantiert – jede Tour!"'
          note: Guaranteed wildlife sighting is an unsupported outcome claim.
      negative:
        - locale: en-GB
          field: description
          text: 'description: "Enjoy unforgettable views over the Thames."'
          note: Subjective marketing, no verifiable claim.

  - id: D4
    name: Inclusion/exclusion mismatch
    severity: critical
    detection: llm
    definition: >
      The title, short_description, or description promises something the
      customer receives (food, drinks, tickets, transport, pickup, equipment,
      guide) that inclusions do not mention.
    decision_rules:
      - Promised but absent from inclusions is D4; promised and listed in exclusions is D2.
      - D3 vs D4 — deliverables (what the customer receives) are D4; qualitative/feature claims (skip-the-line, small group, private, accessible, superlatives) are D3.
      - Listed in inclusions but described as a paid extra is D2, not D4.
      - Optional extras clearly marked as "optional"/"gegen Aufpreis" in the description are not D4.
      - Synonyms count as listed (e.g. "tasting of 5 wines" covers "wine").
    examples:
      positive:
        - locale: en-GB
          field: description, inclusions
          text: 'description: "...followed by a traditional lunch in the village." / inclusions: ["Guide", "Entry tickets"]'
          note: Lunch is promised but not in inclusions.
        - locale: de-DE
          field: short_description, inclusions
          text: 'short_description: "Mit Hotelabholung und Seilbahnticket" / inclusions: ["Seilbahnticket", "Reiseleitung"]'
          note: Hotel pickup promised but not included.
      negative:
        - locale: de-DE
          field: description, inclusions
          text: 'description: "Mittagessen optional gegen Aufpreis" / inclusions: ["Reiseleitung"]'
          note: Lunch is explicitly an optional paid extra.

  - id: D5
    name: Localization error
    severity: major
    detection: both
    definition: >
      Text does not match the listing's locale: untranslated fragments or
      whole passages in the other language, or wrong time/currency/number/date
      format for the locale. Meaning-changing mistranslation is out of scope
      for v1 (CLAUDE.md §11).
    # Allowed formats per locale (first entry = preferred form). Anything listed
    # for the listing's locale is correct.
    locale_conventions:
      de-DE:
        time: ["14:00 Uhr", "14 Uhr", "14:00"]
        currency: ["25 €", "25,00 €", "EUR 25"]
        number: ["1.234,50"]
        date: ["24.12.2026"]
      en-GB:
        time: ["2:00 pm", "2pm", "14:00"]
        currency: ["€25", "EUR 25"]
        number: ["1,234.50"]
        date: ["24 December 2026"]
    decision_rules:
      - Proper nouns, brand names, and established loanwords ("Tour", "Ticket", "Highlights" in DE) are not D5.
      - Format errors are rule-detected; untranslated fragments and wrong-language text are LLM-detected.
      - A price in title, short_description, or description is D6 regardless of its format; do not also label D5 for that price.
      - Fees in cancellation_policy are allowed; their currency/number format is checked for D5.
      - A format error is D5 only when the text uses the other locale's convention (e.g. "€25" or "2:00 pm" in de-DE; "25 €", "14:00 Uhr" or "24.12.2026" in en-GB). Formats in locale_conventions are correct; other stylistic variants are not D5.
    examples:
      positive:
        - locale: de-DE
          field: description
          text: 'description: "Die Tour beginnt am Marktplatz. Please bring comfortable shoes."'
          note: Untranslated English sentence in a German listing.
        - locale: en-GB
          field: meeting_point
          text: 'meeting_point: "Main entrance, 24.12.2026 at 14:00 Uhr"'
          note: German date and time format in an en-GB listing.
      negative:
        - locale: de-DE
          field: title
          text: 'title: "Street-Food-Tour durch Kreuzberg"'
          note: Established loanwords, correct for de-DE.

  - id: D6
    name: Policy violation
    severity: critical
    detection: both
    definition: >
      Content that breaks marketplace policy: contact details (phone numbers,
      email addresses, external URLs, social handles) in any text field;
      prices or discount/promotion language in title, short_description, or
      description; or requests to book or pay off-platform.
    decision_rules:
      - Contact details, URLs, and prices are rule-detected; promotion language and off-platform booking requests are LLM-detected.
      - Contact details count in every text field, including meeting_point and cancellation_policy. Street addresses are not contact details.
      - Prices and any discount/promotion language ("20 % off", "special offer", "nur heute", "Rabatt", "best price guaranteed") count in title, short_description, and description.
      - Fees in cancellation_policy (e.g. "50 % fee if cancelled within 24 h", "10 € Stornogebühr") are allowed and are not D6.
      - Mentioning an entry fee as an exclusion without an amount ("Entry fee not included") is not D6.
      - Discriminatory wording is out of scope for v1 (candidate D9, see CLAUDE.md §11).
    examples:
      positive:
        - locale: en-GB
          field: description
          text: 'description: "Questions? Call Marco on +39 333 123 4567 or visit www.marcotours.it"'
          note: Phone number and external URL in description.
        - locale: de-DE
          field: short_description
          text: 'short_description: "Nur heute 20 % Rabatt – jetzt für 39 € statt 49 €!"'
          note: Price and discount in free text.
      negative:
        - locale: en-GB
          field: meeting_point
          text: 'meeting_point: "Outside Café Nero, 12 Grafton Street, Dublin"'
          note: A physical address is allowed.

  - id: D7
    name: Category/tag mismatch
    severity: major
    detection: both
    definition: >
      The category or a tag is clearly inconsistent with the listing content,
      judged against the fixed `categories` and `tags` vocabularies below, or
      is unsafe/misleading for the audience it targets (e.g. alcohol product
      tagged for children). Vocabulary values are locale-independent.
    categories:
      - Tours & Sightseeing
      - Museums & Exhibitions
      - Attractions & Tickets
      - Food & Drink
      - Outdoor & Adventure
      - Water Activities
      - Day Trips
      - Shows & Performances
      - Classes & Workshops
      - Nightlife
      - Wellness
      - Transfers & Transport
    tags:
      - Walking tour
      - Bus tour
      - Bike tour
      - Boat tour
      - Guided
      - Self-guided
      - Audio guide
      - Family-friendly
      - Kids activities
      - Couples
      - Wine
      - Beer
      - Food tasting
      - Cooking class
      - History
      - Art
      - Architecture
      - Local culture
      - Nature
      - Wildlife
      - Hiking
      - Kayaking
      - Snorkelling
      - Outdoor
      - Indoor
      - Evening
      - Half-day
      - Full-day
      - Multi-day
      - Photography
    decision_rules:
      - A category or tag value not in the vocabularies is D7 (rule-detected); content mismatches are LLM-detected.
      - Judge category and tags against title + description, not against each other.
      - Only flag clear mismatches; tags that are broad but true ("Outdoor" for a walking tour) are not D7.
      - Duration-based tags (Half-day, Full-day, Multi-day) that contradict the duration field are D2, not D7.
      - One D7 per listing for scoring; list each wrong tag as a separate span.
    examples:
      positive:
        - locale: en-GB
          field: tags
          text: 'title: "Rioja Wine Tasting with Cellar Tour" / tags: ["Kids activities", "Wine"]'
          note: Alcohol product tagged for children.
        - locale: de-DE
          field: category
          text: 'title: "Kajaktour auf der Isar" / category: "Museums & Exhibitions"'
          note: Kayak tour categorised as museums.
      negative:
        - locale: de-DE
          field: tags
          text: 'title: "Stadtführung zu Fuß durch Hamburg" / tags: ["Outdoor", "Walking tour"]'
          note: Broad but accurate tags.

  - id: D8
    name: Style/readability
    severity: minor
    detection: rule
    definition: >
      Mechanical style problems in real (non-placeholder) content: ALL-CAPS
      title (≥ 50% of counted title words in caps), title longer than 80
      characters, a sentence or paragraph duplicated within the same field,
      repeated punctuation ("!!!"), or emoji in the title.
    caps_acronym_whitelist:
      - "UNESCO"
    emoji_exclusions:
      - "©"
      - "®"
      - "™"
    decision_rules:
      - D8 applies only to real content; a field whose entire value is a placeholder is D1, not D8.
      - The caps-ratio rule applies to the title only.
      - A word is a whitespace-separated token containing at least one letter; a caps word has all its letters uppercase.
      - Emoji = any character with the Unicode Extended_Pictographic property, except the characters in emoji_exclusions (© ® ™), which are legitimate in brand and attraction names and are never D8.
      - All-caps tokens of ≤ 4 characters (VIP, BBQ, NYC, DB) and tokens in caps_acronym_whitelist are acronyms and are excluded from the caps ratio entirely (neither numerator nor denominator).
      - For the acronym length check, strip leading and trailing punctuation from the token first ("BBQ!!!" → "BBQ", 3 characters, excluded). Repeated punctuation is still a separate D8 trigger.
      - If no countable words remain after excluding acronyms, the caps rule does not fire.
      - Title length is measured in characters after trimming whitespace.
      - Duplicates count only within a single field; text copied between fields (e.g. short_description repeated in description) is not a defect in v1.
      - Tone, wordiness, or weak copy are not D8 (not rule-detectable in v1).
    examples:
      positive:
        - locale: en-GB
          field: title
          text: 'title: "AMAZING SUNSET BOAT TRIP IN SANTORINI!!!"'
          note: All-caps title with repeated punctuation.
        - locale: de-DE
          field: description
          text: 'description: "Erleben Sie die Altstadt. Erleben Sie die Altstadt."'
          note: Sentence duplicated within the description.
      negative:
        - locale: en-GB
          field: title
          text: 'title: "UNESCO Old Town Walk with VIP Wine Tasting"'
          note: UNESCO (whitelisted) and VIP (≤ 4 chars) are acronyms; remaining words are not caps.
