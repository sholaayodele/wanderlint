# Wanderlint runtime configuration. Model names live here only (CLAUDE.md §8).

taxonomy_version: 1
prompt_version: v1

models:
  checker: claude-sonnet-5-5       # default checker
  prescreen: claude-haiku-5-5      # cheap pre-screen experiments (§11)
  datagen: claude-sonnet-5-5       # synthetic listing generation

llm:
  max_tokens: 2048
  # No temperature/top_p/top_k: the current API version rejects sampling
  # parameters (400). Reproducibility comes from the response cache instead.

# Anthropic first-party list prices (USD per million tokens), converted with usd_to_eur.
# cache_write = 5-minute cache write (1.25x input). Update when prices change.
pricing:
  usd_to_eur: 0.90                   # set to the current rate; assumption for now
  usd_per_mtok:
    claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50 }
    claude-haiku-5-5:  { input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125 }

cost:
  target_avg_eur_per_listing: 0.01   # §4 success metric
  hard_cap_eur_per_run: 2.00         # checker/eval runs: abort a run if exceeded
  confirm_above_n_listings: 20       # ask before API runs larger than this (§12)

# Synthetic data generation (scripts/generate_listings.py).
datagen:
  prompt_version: datagen_v1
  effort: low                        # output_config.effort
  max_tokens: 6000
  hard_cap_eur_per_run: 5.00         # separate from the checker cap above
  max_retries: 2                     # regenerations after a failed validation
  clean_fraction: 0.40
  de_fraction: 0.30
  min_per_defect_fraction: 0.10      # 15 per type at n=150
  hard_case_fraction: 0.20
  defective_trap_fraction: 0.30
  output_listings: data/listings/raw/generated.jsonl
  output_meta: data/listings/raw/generated_meta.jsonl
  output_failures: data/listings/raw/generation_failures.jsonl
  output_seeded: data/labels/seeded.jsonl

latency:
  target_p95_s: 5.0

# PLACEHOLDER — set from the eval report's threshold tables, never guessed (§6).
# A defect with confidence >= auto_flag flags the listing automatically;
# between human_review and auto_flag it goes to human review; below it is ignored.
routing:
  thresholds:
    D1: { auto_flag: 0.50, human_review: 0.50 }   # rule-based: confidence is 1.0
    D2: { auto_flag: 0.80, human_review: 0.40 }
    D3: { auto_flag: 0.80, human_review: 0.40 }
    D4: { auto_flag: 0.80, human_review: 0.40 }
    D5: { auto_flag: 0.85, human_review: 0.50 }
    D6: { auto_flag: 0.80, human_review: 0.40 }
    D7: { auto_flag: 0.85, human_review: 0.50 }
    D8: { auto_flag: 0.50, human_review: 0.50 }   # rule-based

paths:
  taxonomy: taxonomy.yaml
  prompts_dir: prompts
  listings_dir: data/listings
  dev: data/listings/dev.jsonl
  test: data/listings/test.jsonl
  regression_dir: data/listings/regression
  labels_dir: data/labels
  gold: data/labels/gold.jsonl
  reports_dir: reports
  cache_dir: .cache/llm
